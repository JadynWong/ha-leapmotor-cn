name: LeapmotorHA
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  LeapmotorHA:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jadynwong.leapmotorha
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "零跑 HA"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "用于连接本地 Home Assistant，读取零跑车辆状态。"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
